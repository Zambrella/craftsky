name: craftsky_app
description: "CraftSky — crafting-focused social platform on AT Protocol."
publish_to: 'none'
version: 1.11.0+16

environment:
  sdk: ^3.13.0
  flutter: ">=3.47.7"

dependencies:
  animated_list_plus: ^0.5.2
  app_settings: ^9.0.0
  archive: ^4.5.1
  at_primitives: ^1.2.0
  cached_network_image: ^4.0.4
  characters: ^1.4.1
  cross_cache: 1.1.1
  crypto: ^3.0.7
  cupertino_ui: ^1.1.2
  dart_mappable: ^4.10.0
  device_info_plus: ^13.3.0
  dio: ^5.11.1
  dynamic_color: ^2.1.0
  file_picker: ^13.1.0
  firebase_core: ^4.15.0
  firebase_messaging: ^16.7.0
  fl_chart: ^1.2.0
  flex_color_scheme: ^9.0.0
  flutter:
    sdk: flutter
  flutter_cache_manager: ^3.4.5
  flutter_chat_core: 2.9.1
  flutter_chat_ui: 2.12.0
  flutter_form_builder: ^11.0.0
  flutter_image_compress: ^2.5.1
  flutter_localizations:
    sdk: flutter
  flutter_native_splash: ^2.4.8
  flutter_riverpod: ^3.4.3
  flutter_secure_storage: ^11.2.0
  flutter_svg: ^2.3.0
  flutter_web_plugins:
    sdk: flutter
  form_builder_validators: ^11.3.0
  go_router: ^18.0.2
  image: ^4.12.0
  image_picker: ^1.2.4
  image_size_getter: ^2.4.1
  intl: ^0.20.3
  l10n_countries: ^2.1.1
  l10n_currencies: ^2.1.0
  logging: ^1.3.0
  material_ui: ^1.6.0
  media_kit: 1.2.6
  media_kit_libs_video: 1.0.7
  media_kit_video: 2.0.1
  mime: ^2.1.0
  multiformats: ^1.4.0
  package_info_plus: ^10.2.2
  path: ^1.9.1
  path_provider: ^2.1.6
  phosphor_icons: ^3.0.1
  pro_image_editor: 14.21.1
  pub_semver: ^2.2.1
  purchases_flutter: ^10.15.2
  purchases_ui_flutter: ^10.15.2
  rive: ^0.14.11
  riverpod_annotation: ^4.0.7
  sealed_countries: ^3.4.1
  sentry_flutter: ^10.0.0
  sentry_logging: 10.0.0
  shared_preferences: ^2.5.6
  skeletonizer: ^3.0.0
  sliver_tools: ^0.2.12
  smooth_page_indicator: ^3.0.0
  timeago: ^3.7.1
  timezone: ^0.11.1
  url_launcher: ^6.3.3
  uuid: ^4.6.0
  visibility_detector: 0.4.0+2
  wakelock_plus: ^1.8.1
  web: ^1.1.1
  youtube_player_iframe: ^6.0.2
dev_dependencies:
  build_runner: ^2.16.2
  dart_mappable_builder: ^4.10.0
  file: ^7.0.1
  flutter_test:
    sdk: flutter
  go_router_builder: ^4.5.0
  http_mock_adapter: ^0.6.1
  icons_launcher: ^3.1.0
  integration_test:
    sdk: flutter
  path_provider_platform_interface: ^2.1.3
  patrol: 4.10.0
  plugin_platform_interface: ^2.1.8
  riverpod_generator: ^4.0.9
  sentry_dart_plugin: ^3.4.0
  sqflite: ^2.4.4+1
  sqflite_common_ffi: ^2.4.3
  very_good_analysis: ^11.0.0

patrol:
  app_name: CraftSky
  android:
    package_name: social.craftsky.app
  ios:
    bundle_id: social.craftsky.app

flutter:
  uses-material-design: true
  generate: true
  config:
    enable-swift-package-manager: true
  assets:
    - assets/animations/
    - assets/design/icons/
    - assets/profile_backgrounds/
    - assets/profile-link-providers/
    - assets/fonts/Outfit-OFL.txt
    - assets/fonts/DMSerifDisplay-OFL.txt
  fonts:
    - family: Outfit
      fonts:
        - asset: assets/fonts/Outfit-100.ttf
          weight: 100
        - asset: assets/fonts/Outfit-200.ttf
          weight: 200
        - asset: assets/fonts/Outfit-300.ttf
          weight: 300
        - asset: assets/fonts/Outfit-400.ttf
          weight: 400
        - asset: assets/fonts/Outfit-500.ttf
          weight: 500
        - asset: assets/fonts/Outfit-600.ttf
          weight: 600
        - asset: assets/fonts/Outfit-700.ttf
          weight: 700
        - asset: assets/fonts/Outfit-800.ttf
          weight: 800
        - asset: assets/fonts/Outfit-900.ttf
          weight: 900
    - family: DMSerifDisplay
      fonts:
        - asset: assets/fonts/DMSerifDisplay-400.ttf
          weight: 400
        - asset: assets/fonts/DMSerifDisplay-400-Italic.ttf
          weight: 400
          style: italic

sentry:
  upload_debug_symbols: true
  upload_source_maps: true
  upload_sources: true
