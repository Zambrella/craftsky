services:
  postgres:
    image: postgres:16@sha256:f1c3376c26f2609ab9f29f71f824103fe2fcd8ee0346485cb6122a4f93df6f94
    restart: unless-stopped
    environment:
      POSTGRES_USER: craftsky
      POSTGRES_PASSWORD: dev
      POSTGRES_DB: craftsky_dev
    ports:
      # The primary checkout defaults to host 5433. scripts/compose-dev gives
      # linked worktrees stable alternate ports so their stacks can coexist.
      - "${CRAFTSKY_POSTGRES_PUBLISH_HOST:-127.0.0.1}:${CRAFTSKY_POSTGRES_PORT:-5433}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U craftsky -d craftsky_dev"]
      interval: 2s
      timeout: 2s
      retries: 15

  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z@sha256:14cea493d9a34af32f524e538b8346cf79f3321eff8e708c1e2960462bd8936e
    restart: unless-stopped
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: craftsky-minio
      MINIO_ROOT_PASSWORD: craftsky-minio-dev-secret
    ports:
      - "${CRAFTSKY_MINIO_PUBLISH_HOST:-127.0.0.1}:${CRAFTSKY_MINIO_PORT:-19000}:9000"
      - "${CRAFTSKY_MINIO_PUBLISH_HOST:-127.0.0.1}:${CRAFTSKY_MINIO_CONSOLE_PORT:-20001}:9001"
    volumes:
      - miniodata:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 2s
      timeout: 2s
      retries: 15

  minio-bootstrap:
    image: minio/mc:RELEASE.2025-08-13T08-35-41Z@sha256:a7fe349ef4bd8521fb8497f55c6042871b2ae640607cf99d9bede5e9bdf11727
    depends_on:
      minio:
        condition: service_healthy
    restart: "no"
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        mc alias set craftsky http://minio:9000 craftsky-minio craftsky-minio-dev-secret
        mc mb --ignore-existing craftsky/private-scheduled-media
        mc anonymous set none craftsky/private-scheduled-media

  migrate:
    build:
      context: ./appview
      dockerfile: Dockerfile
    # Override the image's ENTRYPOINT (/app/appview) so the command runs the
    # CLI binary directly instead of being appended as arguments.
    entrypoint: []
    command: ["/app/cli", "migrate", "up"]
    environment:
      DATABASE_URL: postgres://craftsky:dev@postgres:5432/craftsky_dev?sslmode=disable
      APPVIEW_ENV: dev
      ALLOWED_ORIGINS: "*"
      CRAFTSKY_DEV_DID: did:plc:jt3cxdyrhjhrkpwzdvonheax
      # TAP_WS_URL is required by LoadConfig but unused by `cli migrate`.
      # Kept here so a single compose-level config satisfies all services.
      TAP_WS_URL: ws://tap:2480/channel
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  tap:
    image: ghcr.io/bluesky-social/indigo/tap:0.1.10@sha256:5e20bfe416d29fcd215ed8bf99f10b2ab825a6de4e5599846dd33967ade2abeb
    restart: unless-stopped
    environment:
      TAP_RELAY_URL: https://relay1.us-east.bsky.network
      TAP_DATABASE_URL: sqlite:///data/tap.db
      # Local restarts should resume at the firehose head; tracked repos
      # self-heal through Tap's resync path when their next event arrives.
      TAP_NO_REPLAY: "true"
      # Deliver only the record types our indexers register — see
      # appview/internal/app/deps.go (dispatcher.Register calls).
      # Widening this requires a matching indexer on the appview side,
      # otherwise events hit index.NotImplemented{} and Tap retries forever.
      TAP_COLLECTION_FILTERS: "social.craftsky.actor.profile,social.craftsky.feed.post,social.craftsky.feed.like,social.craftsky.feed.repost,social.craftsky.business.profile,social.craftsky.business.event,app.bsky.actor.profile,app.bsky.graph.follow,app.bsky.graph.block"
      # Auto-discover any repo with a Craftsky profile record. Once a
      # user onboards (InitializeProfile writes social.craftsky.actor.profile
      # via the OAuth callback) the firehose event triggers Tap to add the
      # repo to its watch list and backfill existing records. The static
      # tap-bootstrap below still seeds a handful of known dev DIDs for a
      # fast first-boot path but is now redundant for real users.
      TAP_SIGNAL_COLLECTION: "social.craftsky.actor.profile"
      TAP_LOG_LEVEL: info
    volumes:
      - tapdata:/data
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:2480/health || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 10

  # tap-bootstrap is now mostly redundant: TAP_SIGNAL_COLLECTION on the
  # tap service auto-discovers any repo that writes a Craftsky profile
  # record. We keep it as a backfill helper for repos that wrote their
  # profile record BEFORE signal-collection was configured — Tap only
  # discovers on live firehose events, so pre-existing records don't get
  # ingested until the user writes again. POSTing a new DID to /repos/add
  # tracks and initially syncs it; posting an already-active DID is a no-op.
  # Use `cli tap reconcile DID` when an active repo needs PDS reconciliation.
  #
  # Add dev DIDs here as needed; real users don't need an entry.
  tap-bootstrap:
    image: curlimages/curl:8.22.0@sha256:58adaa4e8dca9c988bae2aba4ab3434a0bb2da16bbe3f92dec39ec7785166777
    depends_on:
      tap:
        condition: service_healthy
    restart: "no"
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        curl -fsS -X POST http://tap:2480/repos/add \
          -H "Content-Type: application/json" \
          -d '{"dids":["did:plc:jt3cxdyrhjhrkpwzdvonheax"]}'

  appview:
    build:
      context: ./appview
      dockerfile: Dockerfile
    restart: unless-stopped
    # The release gate measures the exact runtime image plus 16 MP JPEG/PNG/WebP
    # and maximum admitted upload work under this 512 MiB cgroup limit. Keep
    # decode/upload-body admission at one unless that proof is rerun.
    mem_limit: "${CRAFTSKY_APPVIEW_MEMORY_LIMIT:-512m}"
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      tap:
        condition: service_healthy
      tap-bootstrap:
        condition: service_completed_successfully
      minio-bootstrap:
        condition: service_completed_successfully
    env_file:
      - path: ./appview/environments/dev.env
        required: true
      # Optional developer-owned secrets and local integration configuration.
      # Copy .env.local.example to .env.local; the destination is gitignored.
      - path: ./.env.local
        required: false
    environment:
      APPVIEW_ENV: dev
      DATABASE_URL: postgres://craftsky:dev@postgres:5432/craftsky_dev?sslmode=disable
      TAP_WS_URL: ws://tap:2480/channel
      TAP_ACK_TIMEOUT: "10s"
      TAP_ACK_SAFETY_MARGIN: "500ms"
      TAP_RECONNECT_MAX: "30s"
      ALLOWED_ORIGINS: "*"
      CRAFTSKY_DEV_DID: did:plc:craftsky-dev-user
      APPVIEW_PUBLISH_HOST: "${CRAFTSKY_APPVIEW_PUBLISH_HOST:-127.0.0.1}"
      APPVIEW_DEV_REMOTE_ACCESS: "${APPVIEW_DEV_REMOTE_ACCESS:-false}"
      APPVIEW_DEV_PROTECTED_TRANSPORT: "${APPVIEW_DEV_PROTECTED_TRANSPORT:-false}"
      APPVIEW_DEV_AUTH_SECRET: "${APPVIEW_DEV_AUTH_SECRET:-}"
      APPVIEW_EXPECTED_HOSTS: "${APPVIEW_EXPECTED_HOSTS:-}"
      # Keep localhost OAuth and generated dev-media URLs on this checkout's
      # published AppView port.
      OAUTH_CALLBACK_URL: "http://127.0.0.1:${CRAFTSKY_APPVIEW_PORT:-18080}/oauth/callback"
      CRAFTSKY_DEV_MEDIA_BASE_URL: "http://localhost:${CRAFTSKY_APPVIEW_PORT:-18080}/v1/dev/media"
      SCHEDULED_POSTS_S3_ENDPOINT: http://minio:9000
    ports:
      # The primary checkout defaults to host 18080. scripts/compose-dev gives
      # linked worktrees stable alternate ports so their stacks can coexist.
      - "${CRAFTSKY_APPVIEW_PUBLISH_HOST:-127.0.0.1}:${CRAFTSKY_APPVIEW_PORT:-18080}:8080"
    volumes:
      - ./appview/devmedia:/app/devmedia:ro

volumes:
  pgdata:
  tapdata:
  miniodata:
