version: "1"

previews:
  generation: off

projects:
  - name: craftsky
    environments:
      - name: production
        networking:
          isolation: enabled
        permissions:
          protection: enabled
        databases:
          - name: craftsky-prod-db
            databaseName: craftsky
            user: craftsky
            region: frankfurt
            plan: basic-1gb
            postgresMajorVersion: "16"
            diskSizeGB: 5
            storageAutoscalingEnabled: true
            connectionPool: none
            ipAllowList: []

        envVarGroups:
          - name: craftsky-appview-prod-config
            envVars:
              - key: ALLOWED_ORIGINS
                value: https://craftsky.social,https://www.craftsky.social
              - key: APPVIEW_REPLICA_COUNT
                value: "1"
              - key: APPVIEW_EXPECTED_HOSTS
                value: appview.craftsky.social
              - key: OAUTH_PUBLIC_ORIGIN
                value: https://appview.craftsky.social
              - key: OAUTH_CLIENT_SECRET_KEY_ID
                value: primary
              - key: OAUTH_SCOPES
                value: "atproto transition:generic"
              - key: OAUTH_SESSION_ABSOLUTE_LIFETIME
                value: 4320h
              - key: CRAFTSKY_SESSION_INACTIVITY
                value: 720h
              - key: OAUTH_AUTH_REQUEST_EXPIRY
                value: 30m
              - key: OAUTH_PENDING_AUTH_REQUEST_CAPACITY
                value: "4096"
              - key: OAUTH_AUTH_REQUEST_TERMINAL_RETENTION
                value: 24h
              - key: OAUTH_AUTH_REQUEST_SWEEP_INTERVAL
                value: 1m
              - key: OAUTH_AUTH_REQUEST_SWEEP_BATCH
                value: "100"
              - key: OAUTH_REVOCATION_POLL_INTERVAL
                value: 5s
              - key: OAUTH_REVOCATION_BATCH_SIZE
                value: "20"
              - key: OAUTH_REVOCATION_LEASE_DURATION
                value: 1m
              - key: OAUTH_REVOCATION_OPERATION_TIMEOUT
                value: 20s
              - key: OAUTH_REVOCATION_MAX_ATTEMPTS
                value: "5"
              - key: OAUTH_REVOCATION_BACKOFF_MIN
                value: 1m
              - key: OAUTH_REVOCATION_BACKOFF_MAX
                value: 1h
              - key: OAUTH_REVOCATION_MAX_CREDENTIAL_RETENTION
                value: 24h
              - key: AUTH_AUXILIARY_CLEANUP_POLL_INTERVAL
                value: 5s
              - key: AUTH_AUXILIARY_CLEANUP_BATCH_SIZE
                value: "20"
              - key: AUTH_AUXILIARY_CLEANUP_LEASE_DURATION
                value: 1m
              - key: AUTH_AUXILIARY_CLEANUP_OPERATION_TIMEOUT
                value: 20s
              - key: AUTH_AUXILIARY_CLEANUP_MAX_ATTEMPTS
                value: "5"
              - key: AUTH_AUXILIARY_CLEANUP_BACKOFF_MIN
                value: 1m
              - key: AUTH_AUXILIARY_CLEANUP_BACKOFF_MAX
                value: 1h
              - key: AUTH_SESSION_EXPIRY_SWEEP_INTERVAL
                value: 1m
              - key: AUTH_SESSION_EXPIRY_SWEEP_BATCH
                value: "100"
              - key: ACCOUNT_DELETION_INTENT_TTL
                value: 10m
              - key: ACCOUNT_DELETION_INTENT_SWEEP_INTERVAL
                value: 1m
              - key: ACCOUNT_DELETION_INTENT_SWEEP_BATCH
                value: "100"
              - key: TERMINAL_PURGE_POLL_INTERVAL
                value: 1s
              - key: TERMINAL_PURGE_COMPONENT_LIMIT
                value: "16"
              - key: TERMINAL_PURGE_ROW_BATCH_SIZE
                value: "100"
              - key: TERMINAL_PURGE_LEASE_DURATION
                value: 1m
              - key: TERMINAL_PURGE_RETRY_DELAY
                value: 1s
              - key: IDENTITY_CACHE_REFRESH_POLL_INTERVAL
                value: 5m
              - key: IDENTITY_CACHE_REFRESH_BATCH_SIZE
                value: "100"
              - key: IDENTITY_CACHE_REFRESH_OPERATION_TIMEOUT
                value: 10s
              - key: IDENTITY_CACHE_REFRESH_RETRY_DELAY
                value: 15m
              - key: CRAFTSKY_SESSION_ACTIVITY_WRITE_INTERVAL
                value: 5m
              - key: OAUTH_LOGIN_START_TIMEOUT
                value: 20s
              - key: OAUTH_CALLBACK_OPERATION_TIMEOUT
                value: 45s
              - key: OAUTH_SESSION_OPERATION_TIMEOUT
                value: 30s
              - key: APP_VERIFIED_LINK_ORIGIN
                value: https://app.craftsky.social
              - key: APPVIEW_ENABLE_DEV_OAUTH_SCHEME
                value: "false"
              - key: OAUTH_HANDOFF_EXCHANGE_TTL
                value: 10m
              - key: OAUTH_HANDOFF_CONFIRMATION_TTL
                value: 2m
              - key: OAUTH_HANDOFF_RECEIPT_KEY_VERSION
                value: "1"
              - key: TAP_ACK_TIMEOUT
                value: 10s
              - key: TAP_ACK_SAFETY_MARGIN
                value: 500ms
              - key: TAP_RECONNECT_MAX
                value: 30s
              - key: TAP_PROJECTION_POLL_INTERVAL
                value: 250ms
              - key: TAP_PROJECTION_LEASE_DURATION
                value: 30s
              - key: TAP_PROJECTION_BATCH_SIZE
                value: "32"
              - key: TAP_PROJECTION_BACKOFF_MIN
                value: 1s
              - key: TAP_PROJECTION_BACKOFF_MAX
                value: 5m
              - key: TAP_REPOSITORY_POLL_INTERVAL
                value: 1s
              - key: TAP_REPOSITORY_LEASE_DURATION
                value: 45s
              - key: TAP_REPOSITORY_BATCH_SIZE
                value: "8"
              - key: TAP_REPOSITORY_BACKOFF_MIN
                value: 2s
              - key: TAP_REPOSITORY_BACKOFF_MAX
                value: 5m
              - key: TAP_QUARANTINE_POLL_INTERVAL
                value: 1s
              - key: TAP_QUARANTINE_LEASE_DURATION
                value: 30s
              - key: TAP_QUARANTINE_OPERATION_TIMEOUT
                value: 10s
              - key: TAP_QUARANTINE_BATCH_SIZE
                value: "8"
              - key: HTTP_MAX_CONNECTIONS
                value: "512"
              - key: HTTP_MAX_IN_FLIGHT_REQUESTS
                value: "256"
              - key: HTTP_READ_HEADER_TIMEOUT
                value: 5s
              - key: HTTP_READ_TIMEOUT
                value: 90s
              - key: HTTP_WRITE_TIMEOUT
                value: 2m
              - key: HTTP_IDLE_TIMEOUT
                value: 1m
              - key: HTTP_MAX_HEADER_BYTES
                value: "32768"
              - key: HTTP_TRUSTED_PROXY_CIDRS
                value: ""
              - key: HTTP_CLIENT_IPV6_PREFIX_BITS
                value: "64"
              - key: HTTP_OUTER_RATE_WINDOW
                value: 1m
              - key: HTTP_OUTER_GLOBAL_LIMIT
                value: "6000"
              - key: HTTP_OUTER_CLIENT_LIMIT
                value: "6000"
              - key: HTTP_LIMITER_CAPACITY
                value: "4096"
              - key: HTTP_LIMITER_IDLE_TTL
                value: 10m
              - key: HTTP_JSON_BODY_READ_TIMEOUT
                value: 10s
              - key: HTTP_UPLOAD_BODY_READ_TIMEOUT
                value: 1m
              - key: MODERATION_ADMIN_ENABLED
                value: "false"
              - key: PUSH_ENABLED
                value: "false"
              - key: OWNER_FENCE_ACQUIRE_TIMEOUT
                value: 5s
              - key: PDS_EFFECT_TIMEOUT
                value: 10s
              - key: SCHEDULED_MEDIA_PUT_TIMEOUT
                value: 30s
              - key: FEDERATED_HTTP_DIAL_TIMEOUT
                value: 5s
              - key: FEDERATED_HTTP_TLS_HANDSHAKE_TIMEOUT
                value: 5s
              - key: FEDERATED_HTTP_RESPONSE_HEADER_TIMEOUT
                value: 10s
              - key: FEDERATED_HTTP_EXPECT_CONTINUE_TIMEOUT
                value: 1s
              - key: FEDERATED_HTTP_IDLE_CONN_TIMEOUT
                value: 30s
              - key: FEDERATED_HTTP_MAX_RESPONSE_HEADER_BYTES
                value: "65536"
              - key: FEDERATED_OAUTH_METADATA_TIMEOUT
                value: 10s
              - key: FEDERATED_OAUTH_REQUEST_TIMEOUT
                value: 15s
              - key: FEDERATED_PDS_JSON_TIMEOUT
                value: 15s
              - key: FEDERATED_PDS_REPOSITORY_TIMEOUT
                value: 2m
              - key: FEDERATED_PDS_UPLOAD_TIMEOUT
                value: 20s
              - key: FEDERATED_OAUTH_METADATA_RESPONSE_LIMIT_BYTES
                value: "65536"
              - key: OAUTH_AUTHORITY_METADATA_CACHE_TTL
                value: 5m
              - key: OAUTH_AUTHORITY_METADATA_CACHE_CAPACITY
                value: "10000"
              - key: FEDERATED_OAUTH_RESPONSE_LIMIT_BYTES
                value: "262144"
              - key: FEDERATED_PDS_JSON_RESPONSE_LIMIT_BYTES
                value: "4194304"
              - key: FEDERATED_PDS_REPOSITORY_RESPONSE_LIMIT_BYTES
                value: "67108864"
              - key: FEDERATED_PDS_UPLOAD_RESPONSE_LIMIT_BYTES
                value: "262144"
              - key: SCHEDULED_POSTS_S3_ENDPOINT
                value: https://s3.eu-central-1.amazonaws.com
              - key: SCHEDULED_POSTS_S3_REGION
                value: eu-central-1
              - key: LINK_PREVIEWS_ENABLED
                value: "false"
              - key: VIDEO_SERVICE_URL
                value: https://video.bsky.app
              - key: VIDEO_PLAYLIST_URL_TEMPLATE
                value: https://video.bsky.app/watch/{did}/{cid}/playlist.m3u8
              - key: VIDEO_THUMBNAIL_URL_TEMPLATE
                value: https://video.bsky.app/watch/{did}/{cid}/thumbnail.jpg
              - key: SCHEDULED_IMAGE_MAX_WIDTH
                value: "4000"
              - key: SCHEDULED_IMAGE_MAX_HEIGHT
                value: "4000"
              - key: SCHEDULED_IMAGE_MAX_PIXELS
                value: "16000000"
              - key: SCHEDULED_IMAGE_MAX_ASPECT_RATIO
                value: "20"
              - key: SCHEDULED_IMAGE_MAX_CONCURRENT_DECODES
                value: "1"
              - key: SCHEDULED_IMAGE_ADMISSION_WAIT
                value: 250ms
              - key: SENTRY_LOGS_ENABLED
                value: "false"
              - key: SENTRY_TRACING_ENABLED
                value: "false"
              - key: SENTRY_METRICS_ENABLED
                value: "false"
              - key: SENTRY_TAP_TRACING_ENABLED
                value: "false"
              - key: APPVIEW_UNSAFE_LOG_RESPONSE_BODIES
                value: "false"

        services:
          - type: pserv
            name: craftsky-tap
            runtime: image
            image:
              url: ghcr.io/bluesky-social/indigo/tap:0.1.10@sha256:5e20bfe416d29fcd215ed8bf99f10b2ab825a6de4e5599846dd33967ade2abeb
            region: frankfurt
            plan: 0.5c-512mb
            numInstances: 1
            autoDeployTrigger: off
            disk:
              name: craftsky-tap-data
              mountPath: /data
              sizeGB: 1
            envVars:
              - key: PORT
                value: "2480"
              - key: TAP_BIND
                value: ":2480"
              - key: TAP_RELAY_URL
                value: https://relay1.us-east.bsky.network
              - key: TAP_DATABASE_URL
                value: sqlite:///data/tap.db
              - key: TAP_COLLECTION_FILTERS
                value: social.craftsky.actor.profile,social.craftsky.feed.post,social.craftsky.feed.like,social.craftsky.feed.repost,social.craftsky.business.profile,social.craftsky.business.event,app.bsky.actor.profile,app.bsky.graph.follow,app.bsky.graph.block
              - key: TAP_SIGNAL_COLLECTION
                value: social.craftsky.actor.profile
              - key: TAP_LOG_LEVEL
                value: info
              - key: TAP_NO_REPLAY
                value: "false"
              - key: TAP_DISABLE_ACKS
                value: "false"
              - key: CRAFTSKY_TAP_WS_URL
                value: ws://craftsky-tap:2480/channel

          - type: web
            name: craftsky-appview
            runtime: docker
            repo: https://github.com/Zambrella/craftsky
            branch: main
            rootDir: appview
            dockerContext: .
            dockerfilePath: ./Dockerfile
            region: frankfurt
            plan: 0.5c-512mb
            numInstances: 1
            autoDeployTrigger: off
            preDeployCommand: /app/cli --env prod ping && /app/cli --env prod migrate up
            healthCheckPath: /health
            domains:
              - appview.craftsky.social
            renderSubdomainPolicy: disabled
            disk:
              name: craftsky-appview-deploy-serialization
              mountPath: /var/lib/craftsky-deploy-serialization
              sizeGB: 1
            envVars:
              - fromGroup: craftsky-appview-prod-config
              - key: DATABASE_URL
                fromDatabase:
                  name: craftsky-prod-db
                  property: connectionString
              - key: TAP_WS_URL
                fromService:
                  type: pserv
                  name: craftsky-tap
                  envVarKey: CRAFTSKY_TAP_WS_URL
              - key: OAUTH_CLIENT_SECRET_KEY
                sync: false
              - key: OAUTH_HANDOFF_RECEIPT_KEY
                sync: false
              - key: SCHEDULED_POSTS_S3_BUCKET
                sync: false
              - key: SCHEDULED_POSTS_S3_ACCESS_KEY_ID
                sync: false
              - key: SCHEDULED_POSTS_S3_SECRET_ACCESS_KEY
                sync: false
