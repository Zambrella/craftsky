name: AppView release gate

on:
  pull_request:
  push:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: appview-check-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  appview-check:
    name: AppView check
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      APPVIEW_CHECK_ARTIFACT_DIR: ${{ runner.temp }}/appview-check

    steps:
      - name: Check out repository
        uses: actions/checkout@1af3b93b6815bc44a9784bd300feb67ff0d1eeb3 # v6.0.0

      - name: Install Go 1.26.6
        uses: actions/setup-go@44694675825211faa026b3c33043df3e48a5fa00 # v6.0.0
        with:
          go-version: 1.26.6
          check-latest: false
          cache-dependency-path: appview/go.sum

      - name: Install just 1.46.0
        uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4.0.0
        with:
          just-version: 1.46.0

      - name: Run fail-closed AppView release gate
        run: just appview-check

      - name: Upload release-gate evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: appview-check-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ env.APPVIEW_CHECK_ARTIFACT_DIR }}/*.json
            ${{ env.APPVIEW_CHECK_ARTIFACT_DIR }}/*.log
            ${{ env.APPVIEW_CHECK_ARTIFACT_DIR }}/*.txt
          if-no-files-found: ignore
          retention-days: 7
