name: CraftSky web client
on:
  pull_request:
    branches: [main]
    paths:
      - 'web-client/**'
      - 'config/**'
      - 'scripts/config'
      - 'verified-links/**'
      - 'scripts/public-app-dev'
      - 'scripts/compose-dev'
      - 'scripts/test_public_app_dev.py'
      - 'scripts/release'
      - 'scripts/test_release.py'
      - 'scripts/web-client-deploy'
      - 'scripts/test_web_client_deploy.py'
      - 'justfile'
      - '.github/workflows/web-client-ci.yml'
permissions:
  contents: read
jobs:
  web-client:
    runs-on: ubuntu-24.04
    container:
      # Match the Playwright version in web-client/package-lock.json.
      image: mcr.microsoft.com/playwright:v1.64.1-noble@sha256:2f05f8a734509a7b3f26a912639488ee08f58a7b292d14d62271bcff9038768f
      options: --ipc=host
    # Sequential Vite and Worker browser suites take about 25m on hosted runners.
    timeout-minutes: 35
    defaults:
      run:
        working-directory: web-client
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
      - name: Trust checkout inside the job container
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: web-client/package-lock.json
      - run: python3 -m unittest discover -s ../scripts -p test_public_app_dev.py
      - run: python3 -m unittest discover -s ../scripts -p test_web_client_deploy.py
      - run: python3 -m unittest discover -s ../scripts -p test_release.py
      - run: npm ci
      - run: npm run test:release
      - name: Upload local fixture failure artifacts
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: web-client-fixture-failures
          path: |
            web-client/test-results/
            web-client/test-results-authenticated/
            web-client/test-results-guest/
            web-client/playwright-report/
          retention-days: 7
          if-no-files-found: ignore
