name: Backend CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: backend-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  appview-release-gate:
    name: AppView release gate
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@44694675825211faa026b3c33043df3e48a5fa00 # v6.0.0
        with:
          go-version: 1.27.1
          cache-dependency-path: appview/go.sum

      - name: Install release-gate tools
        run: sudo apt-get update && sudo apt-get install --yes just ripgrep

      - name: Lint GitHub Actions workflows
        run: go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.7

      - name: Run AppView release gate
        env:
          APPVIEW_CHECK_ARTIFACT_DIR: ${{ runner.temp }}/appview-check
          GOFLAGS: -p=1
        run: ./scripts/appview-check

      - name: Upload release evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: appview-release-evidence-${{ github.sha }}
          path: ${{ runner.temp }}/appview-check
          if-no-files-found: warn
          retention-days: 14
